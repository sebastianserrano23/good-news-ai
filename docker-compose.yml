services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: goodnews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: goodnews
    ports:
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports: 
      - "6379:6379"

volumes:
  pgdata: